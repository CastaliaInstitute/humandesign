<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BodyGraph">
  <title>BodyGraph Flow · Castalia Human Design</title>
  <link rel="manifest" href="/bodygraph.webmanifest">
  <link rel="icon" href="/bodygraph-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/bodygraph-icon-192.png">
  <style>
    :root,html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
    #info-panel{position:fixed;z-index:2;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));max-height:min(32vh,240px);overflow:auto;box-sizing:border-box;padding:12px 42px 12px 14px;border:1px solid #f5a742;border-radius:6px;background:rgba(39,41,35,.97);color:#fff9ed;font:14px/1.4 system-ui,sans-serif;box-shadow:0 4px 24px #0009;display:none;overscroll-behavior:contain}
    #info-panel.is-visible{display:block}
    #info-title{font-weight:650;color:#ffd18a;margin:0 0 5px}
    #info-detail{margin:0;white-space:pre-wrap}
    #planet-comparison{margin-top:9px}
    #planet-comparison h3{margin:0 0 4px;color:#ffd18a;font-size:12px;font-weight:650}
    #planet-comparison table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.3;text-align:left}
    #planet-comparison th,#planet-comparison td{padding:3px 8px 3px 0;border-top:1px solid #ffffff25;vertical-align:top}
    #planet-comparison th{color:#c9c3b6;font-weight:550}
    #info-close{position:absolute;right:8px;top:7px;width:28px;height:28px;border:0;border-radius:50%;background:#ffffff18;color:#fff;font:20px/1 system-ui;cursor:pointer}
    @media(max-width:600px){#info-panel{font-size:13px;max-height:28vh;padding:10px 40px 10px 12px}}
  </style>
</head>
<body>
  <iframe id="bodygraph" title="Interactive Human Design BodyGraph"></iframe>
  <section id="info-panel" aria-live="polite" aria-hidden="true" aria-label="Selected BodyGraph information">
    <button id="info-close" type="button" aria-label="Close information panel">×</button>
    <h2 id="info-title"></h2>
    <p id="info-detail"></p>
    <div id="planet-comparison" hidden>
      <h3>Same-planet activations</h3>
      <table>
        <thead><tr><th>Gate</th><th>Name</th><th>Planet</th><th>Side</th></tr></thead>
        <tbody id="planet-rows"></tbody>
      </table>
    </div>
  </section>
  <script>
    const params = new URLSearchParams(location.search);
    const chart = params.get('chart') || params.get('person');
    const frame = document.querySelector('#bodygraph');
    const panel = document.querySelector('#info-panel');
    const title = document.querySelector('#info-title');
    const detail = document.querySelector('#info-detail');
    const planetComparison = document.querySelector('#planet-comparison');
    const planetRows = document.querySelector('#planet-rows');
    function hideInfo() {
      panel.classList.remove('is-visible');
      panel.setAttribute('aria-hidden', 'true');
    }
    function dismissInfo() {
      hideInfo();
      frame.contentWindow?.postMessage({ type: 'bodygraph-info-dismiss' }, '*');
    }
    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow || event.data?.type !== 'bodygraph-info') return;
      if (event.data.action === 'hide') { hideInfo(); return; }
      title.textContent = event.data.title || 'BodyGraph';
      detail.textContent = event.data.detail || '';
      planetRows.replaceChildren();
      const rows = Array.isArray(event.data.planetPairs) ? event.data.planetPairs.flatMap(pair => [
        { gate: pair.personality.gate, name: pair.personality.name, planet: pair.planet, side: 'Personality' },
        { gate: pair.design.gate, name: pair.design.name, planet: pair.planet, side: 'Design' }
      ]) : [];
      rows.forEach(row => {
        const tr = document.createElement('tr');
        [row.gate, row.name, row.planet, row.side].forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          tr.append(td);
        });
        planetRows.append(tr);
      });
      planetComparison.hidden = rows.length === 0;
      panel.classList.add('is-visible');
      panel.setAttribute('aria-hidden', 'false');
    });
    document.querySelector('#info-close').addEventListener('click', dismissInfo);
    frame.src = '/bodygraph.svg?v=mobile-gate-labels-20261022' + (chart ? '&chart=' + encodeURIComponent(chart) : '');
  </script>
</body>
</html>
